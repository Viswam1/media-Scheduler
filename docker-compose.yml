services:
  media-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: church-media-scheduler:latest
    container_name: church-media-scheduler
    restart: unless-stopped

    ports:
      - "8501:8501"

    volumes:
      # Persist the SQLite database across container restarts
      - ./data:/app/data

    environment:
      - TZ=Asia/Kolkata          # change to your timezone
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Optional: cap resources so it never eats the whole host
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
